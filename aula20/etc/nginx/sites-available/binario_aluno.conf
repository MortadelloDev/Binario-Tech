server {
    listen 8080;
    server_name localhost;

    # Exercício 2: Limita o tamanho máximo do corpo da requisição a 2 Megabytes
    client_max_body_size 2M;

    # Exercício 1: Resposta direta em JSON sem passar pelo Node.js
    location /status-nginx {
        default_type application/json;
        return 200 '{"status": "sucesso", "mensagem": "Nginx respondendo diretamente sem Node.js"}';
    }

    location /api/v1/proxy/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}